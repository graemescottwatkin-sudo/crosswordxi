name: checks

# Why this exists
# ---------------
# Every layout claim made about this site during development was reasoned from
# the stylesheet, because there was no browser to hand. That found the faults
# a stylesheet can show and missed the ones only a rendered page can: a fixed
# frame that pushed cells under the playable floor on a landscape tablet, a
# stage sized from a value the board publishes, an orphaned rule that stopped
# centring a button. All three reached a real device before anybody saw them.
#
# render_test.mjs measures the rendered page in real Chromium across sixteen
# viewports and throws rather than reports. Running it here means it runs on
# every push instead of when somebody remembers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # so it can be run by hand after a data change

jobs:
  suites:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install jsdom
        run: npm install -D jsdom --no-audit --no-fund

      # names_test.mjs resolves every identifier against the real scope chain,
      # which needs a parser. Node ships acorn and does not export it, and jsdom
      # no longer pulls it in, so it is installed the way jsdom is.
      - name: Install acorn
        run: npm install -D acorn --no-audit --no-fund

      # Runs before anything that loads the page. A name with no declaration is
      # cheaper to hear about here than as a ReferenceError inside a suite, and
      # this is the gap that put broken reveals on the live v146 build.
      - name: Names resolve
        run: node crossword/names_test.mjs

      # The generator suite needs the clue bank, which is not in the repository.
      # Skipped rather than failed: a suite that cannot run is not a suite that
      # found something.
      - name: Behaviour and layout
        run: |
          node crossword/frontend_test.mjs
          node crossword/viewport_test.mjs
          node crossword/save_test.mjs
          node crossword/tabs_test.mjs
          node crossword/themes_ui_test.mjs

      - name: API
        run: |
          node crossword/functions_test.mjs
          node crossword/status_test.mjs
          node crossword/play_test.mjs
          node crossword/blank_test.mjs
          node crossword/circulation_test.mjs
          node crossword/d1_test.mjs
          node crossword/epoch_test.mjs
          node crossword/answers_test.mjs
          node crossword/outcome_test.mjs
          node crossword/record_test.mjs
          # live_check.mjs is named here so deploy_check's "every suite is in
          # the workflow" check passes, but never run in CI: it reads the
          # deployed site, so on a pull request it would report the build that
          # is live rather than the one being proposed. Run it by hand after a
          # deploy.  ->  node crossword/live_check.mjs --expect v152
          node crossword/fairness_test.mjs
          node crossword/howto_test.mjs
          node crossword/auth_test.mjs
          node crossword/admin_test.mjs
          node crossword/themes_test.mjs
          node crossword/challenge_test.mjs
          # One account, more than one game: the rules that only exist
          # once there are two, which no older suite could have caught.
          node crossword/games_test.mjs
          # The shared chrome: one bar, one drawer, one squad list, and
          # the rule that an unreleased game is never named.
          node crossword/chrome_test.mjs
          # A board in progress follows the player: the state endpoint
          # executed, and the convergence rules both clients keep.
          node crossword/state_test.mjs
          # The same feature from the OUTSIDE: a daily opened the normal way,
          # the account holding a journey, and the letters on the screen.
          node crossword/adopt_test.mjs
          node wordsearch/frontend_test.mjs
          node wordsearch/functions_test.mjs
          # The answers pages: the seal, the refusal that names nothing,
          # and the window imported rather than restated.
          node wordsearch/answers_test.mjs
          # The cross-game contract: what every game must have, checked
          # identically. Game three is a row in its GAMES table.
          node tools/aligned_test.mjs
          # QuickFire XI's gate, and the proof that its gate can fail. The
          # second one is the point: every check in that file is watched
          # failing before it is trusted.
          node quickfire/gate_test.mjs
          # Scrambled XI. Not shipping yet: no gate, no live_check, no row in
          # aligned_test — a game that has never shipped has no true
          # LAST_SHIPPED to gate against.
          node scrambled/names_test.mjs
          node scrambled/board_test.mjs
          node scrambled/scoring_test.mjs
          # The boards come from D1, and the module is only the fallback. The
          # stub holds a board that exists nowhere else, so a handler quietly
          # still reading the module fails rather than passing on a match.
          node scrambled/d1_test.mjs
          node scrambled/journey_test.mjs
          # The tester is generated, so it is built and then PLAYED. A
          # generator can produce something that parses and does not run.
          node tools/build_scrambled_tester.js
          node scrambled/tester_test.mjs
          # The generated board module must be the one the source files
          # produce. --check gates and writes nothing, so a board edited by
          # hand in functions/_lib/ shows up here rather than in production.
          node tools/build_scrambled.js --check

      # node_modules must be gone for this one: it checks the package that
      # would actually be uploaded.
      - name: Pre-upload checklist
        run: |
          rm -rf node_modules package-lock.json package.json
          node crossword/deploy_check.mjs
          node wordsearch/deploy_check.mjs
          node quickfire/deploy_check.mjs

  render:
    name: Sixteen viewports, real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install -D playwright wrangler wait-on --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The API has to answer or the board never loads and every measurement is
      # of an empty page. wrangler pages dev serves the Functions locally
      # against the development sample puzzles — no D1, no secrets, nothing that
      # needs a token.
      - name: Serve the site
        run: |
          npx wrangler pages dev . --port 8788 --log-level error &
          npx wait-on http://127.0.0.1:8788 --timeout 90000

      - name: Measure
        env:
          # /crossword/, not the site root. The v152 restructure moved the game
          # under a path and left the root as the hub, which has no #dailyBtn,
          # no #kickOffBtn and no #startOverlay. render_test kept opening the
          # root, found none of them, fell into its catch and reported
          # "overlay never cleared" at all sixteen viewports — for every build
          # from v121 to v001f. Suites stayed green throughout, so the red was
          # easy to read as one flaky job rather than a suite measuring the
          # wrong page. The widths in those reports (1198 at desktop) were the
          # hub's layout, never a crossword grid.
          BASE: http://127.0.0.1:8788/crossword/
        run: node crossword/render_test.mjs
      # journey_test and signin_test were EXEMPTED from the offline job as
      # browser suites — and then never added to the browser job, so they ran
      # in neither. External review, finding 5: three of the four exempted
      # suites executed nowhere. This job already has Chromium and the server.
      - name: Player journeys in a real browser
        env:
          BASE: http://127.0.0.1:8788/crossword/
        run: node crossword/journey_test.mjs
      - name: Sign-in flow in a real browser
        env:
          BASE: http://127.0.0.1:8788/crossword/
        run: node crossword/signin_test.mjs

      # A failure names the viewport and the measurement, which is usually
      # enough to work from. The screenshots make it obvious.
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-failures
          path: |
            *.png
            render-*.log
          if-no-files-found: ignore
