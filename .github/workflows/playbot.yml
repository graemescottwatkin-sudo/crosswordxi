# Play bot — does today's board actually play?
#
# The nightly preflight asks whether the coming boards are well FORMED. This
# asks whether today's can be PLAYED, which is the question that needs a
# running server: what it exercises is the WIRING — that production applies its
# own scoring rule to a real play, on a clock it kept, against fouls it
# recorded. A shape rule cannot tell you that.
#
# LIVE FROM 5 Sep 2026. The bot plays as ONE account, created by device code —
# no name, no email, exactly the "a random string and some scores" case
# functions/api/account/code.js describes — so excluding its plays from any
# table ever built is one user_id, forever:
#
#   5dcc40a3-3ef1-422a-8c21-ef90355f243c
#
# The code itself is the repository secret XI_BOT_CODE and is never entered on
# a real device. If it is missing the bot REFUSES to run rather than playing
# anonymously: ten sessions a night is ~3,650 rows a year, half carrying a real
# verified score, and rows written without an account could never afterwards be
# told apart from a player's.
name: Play bot

on:
  schedule:
    # 01:30 UTC — after the preflight at 01:10, so a board that is malformed is
    # already reported and this is not the thing that finds it second.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      games:
        description: "Which games (comma separated), or blank for all five"
        required: false
        default: ""

jobs:
  play:
    name: Ten sessions against the live site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install: fetch and nothing else. The repo has no package.json on
      # purpose and this job must not become the reason for one.
      - name: Play
        env:
          XI_BOT_CODE: ${{ secrets.XI_BOT_CODE }}
          GAMES: ${{ github.event.inputs.games }}
        run: node tools/play_bot.mjs
