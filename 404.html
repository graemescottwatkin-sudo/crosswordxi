<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the pitch — Crossword XI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E6B45">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231E6B45'/%3E%3Crect x='6' y='6' width='8' height='8' fill='%23fff'/%3E%3Crect x='18' y='6' width='8' height='8' fill='%23fff' opacity='.45'/%3E%3Crect x='6' y='18' width='8' height='8' fill='%23fff' opacity='.45'/%3E%3Crect x='18' y='18' width='8' height='8' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F4F5F2; --card:#FFFFFF; --ink:#182219; --ink-soft:#5A675D;
  --pitch:#1E6B45; --pitch-deep:#123B27; --line:#D9DDD6;
  --disp:"Barlow Condensed",-apple-system,"Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#12160F;--card:#1B2118;--ink:#E6EAE2;--ink-soft:#9BA894;
        --pitch:#4FB07C;--pitch-deep:#8FD9AE;--line:#2A3326}
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--paper);color:var(--ink);font-family:var(--body);padding:24px;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:34px 30px;max-width:440px;width:100%;text-align:center;
}
.code{
  font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--pitch);margin-bottom:10px;
}
h1{
  font-family:var(--disp);font-weight:700;font-size:38px;letter-spacing:.02em;
  margin:0 0 10px;color:var(--pitch-deep);text-transform:uppercase;
}
p{margin:0 0 22px;color:var(--ink-soft);font-size:15px;line-height:1.55}
a.btn{
  display:inline-block;font-family:var(--disp);font-weight:600;font-size:15px;
  letter-spacing:.06em;text-transform:uppercase;text-decoration:none;
  background:var(--pitch);color:#fff;border-radius:6px;padding:11px 22px;
}
a.btn:hover{background:var(--pitch-deep)}
</style>
</head>
<body>
  <div class="card">
    <div class="code">404 &middot; Page not found</div>
    <h1>Out for a throw-in</h1>
    <p>That page has gone off the pitch. Today&rsquo;s crossword is still waiting.</p>
    <a class="btn" href="/">Back to the puzzle</a>
  </div>
</body>
</html>
